name: Release

# Push a tag like v1.0.0 to build spring-init.exe and publish it on a GitHub release for that tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build spring-init.exe
        run: |
          mkdir dist -Force
          npm run build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/spring-init.exe
