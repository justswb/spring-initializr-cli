name: Release

# Push a tag like v1.0.0 to build spring-init.exe, test it, and publish it on a GitHub release for that tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build spring-init.exe
        run: go build -trimpath -ldflags="-s -w" -o dist/spring-init.exe .

      - name: Test spring-init.exe
        run: go test -v ./...
        env:
          SPRING_INIT_BIN: dist/spring-init.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/spring-init.exe
